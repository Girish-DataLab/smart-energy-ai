<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 900px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th {
            background: #3498db;
            color: white;
            padding: 10px;
        }

        td {
            padding: 8px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .nav {
            margin-top: 20px;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            margin: 10px;
        }

        a:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📊 Prediction History</h2>

    {% if tables %}
        {{ tables | safe }}
    {% else %}
        <p class="empty">No history available</p>
    {% endif %}

    <div class="nav">
        <a href="/dashboard">⬅ Back to Dashboard</a>
        <a href="/download">⬇ Download CSV</a>
    </div>

</div>

</body>
</html>
